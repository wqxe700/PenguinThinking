/* ========== 基础 ========== */
* { margin: 0; padding: 0; }

/* ========== 侧边栏背景（底部大图） ========== */
#sidebar-bg {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 256px;

/* ========== 项目面板（XP风格左侧建议栏样式，置于侧边栏上方） ========== */
#task-panel {
  position: fixed;
  right: 0;
  top: 12px;       /* 原始 top:12 对应标题位置 */
  width: 256px;
  z-index: 10;     /* 必须在背景之上 */
  font-family: Tahoma, "\5B8B\4F53", sans-serif;
  color: #000;
}

/* 标题区：电脑图标 + “项目” */
.task-header {
  height: 32px;
  margin-bottom: 8px; /* 标题和列表的微小间距 */
  position: relative;
}
.task-header img {
  position: absolute;
  left: 84px;   /* 256 - 140 - 32 */
  top: 0;
  width: 32px;
  height: 32px;
  border: 0;
}
.task-header span {
  position: absolute;
  left: 121px;  /* 256 - 95 - 40(文字宽度估算) */
  top: 8px;
  font-family: "\7B49\7EBF", Tahoma, sans-serif;
  font-size: 14px;
  font-weight: bold;
}

/* 链接列表（自动从上到下，紧凑排列） */
.task-list {
  list-style: none;
  margin: 0;
  padding: 0 10px; /* 左右留一点边距 */
}
.task-item {
  height: 20px;
  line-height: 20px;
  margin: 0;        /* XP风格：无额外间距，完全紧凑 */
  overflow: hidden;
  zoom: 1;
}
.task-link {
  display: block;
  text-decoration: none;
  color: #000;
  padding: 0 2px;
  cursor: pointer;
}
/* XP Luna 悬停：蓝底白字 */
.task-link:hover {
  background-color: #3169C6;
  color: #fff;
}

/* 绿色继续图标（green-pass） */
.task-icon {
  float: left;
  width: 20px;
  height: 20px;
  margin-right: 4px; /* 图标和文字的间距 */
}
.task-icon img {
  border: 0;
  width: 20px;
  height: 20px;
  vertical-align: middle;
}
/* 项目文字（自动对齐） */
.task-text {
  display: block;
  margin-left: 24px; /* 20px图标 + 4px间距，保证所有文字左边缘对齐 */
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ========== 底部元素 ========== */
.footer-penguin {
  position: fixed;
  right: 0;
  bottom: 10px;
  width: 256px;
  height: 128px;
  border: 0;
  z-index: 9999;
}
.footer-copy {

  color: #808080;
  font-family: "\5FAE\8F6F\96C5\9ED1", Tahoma, sans-serif;

  z-index: 9992;
}
.contact-me {
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 9999;
}
</style>
